<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<title>AI Financial & Insurance Advisor</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-slate-100">
<div id="root"></div>

<script type="text/babel">

/* =========================
   UTILITIES (LOCK)
========================= */
const formatNumber = n =>
  n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",")

const parseNumber = v =>
  parseInt(String(v).replace(/\D/g,'')) || 0

/* =========================
   RULE ENGINE (LOCK)
========================= */
const RuleEngine = {

  calculateHealthRisk(data){
    const reserveMonths = data.cash / (data.expenses || 1)
    let level = "ดี"
    if(reserveMonths < 3) level = "เสี่ยงสูง"
    else if(reserveMonths < 6) level = "ปานกลาง"

    const hasHealthInsurance = data.insurances
      .some(i => ["ประกันสุขภาพ","ประกันโรคร้ายแรง"].includes(i.type))

    let score = 0
    if(hasHealthInsurance) score += 50
    score += Math.min(50, Math.round(reserveMonths / 6 * 50))

    return { level, score }
  },

  calculateWealthRisk(data){
    const saving = data.income - data.expenses
    const totalAssets = data.cash + data.invest + data.property + data.otherAsset
    const totalDebt = data.debtHome + data.debtCar + data.debtPersonal

    let score = 0
    if(saving > 0) score += Math.min(40, Math.round(saving / data.income * 40))
    score += Math.min(40, Math.round((data.invest / (totalAssets||1)) * 40))
    score += Math.max(0, Math.round((1 - totalDebt/(totalAssets||1)) * 20))

    let level = score < 40 ? "เสี่ยงสูง" : score < 70 ? "ปานกลาง" : "ดี"
    return { level, score }
  },

  calculateLifeRisk(data){
    const need =
      (data.expenses * 12 * 5) +
      (data.debtHome + data.debtCar + data.debtPersonal) +
      (data.children * 1000000)

    const lifeCoverage = data.insurances
      .filter(i =>
        ["ประกันชีวิต","ประกันบำนาญ","ประกันสะสมทรัพย์","ประกันชีวิตแบบชั่วระยะเวลา"]
        .includes(i.type))
      .reduce((s,i)=>s+i.coverage,0)

    const gap = Math.max(0, need - lifeCoverage)
    const score = Math.min(100, Math.round(lifeCoverage / (need||1) * 100))
    let level = score < 40 ? "เสี่ยงสูง" : score < 70 ? "ปานกลาง" : "ดี"

    return { need, lifeCoverage, gap, score, level }
  },

  recommend(health, wealth, life){
    const rec = []

    if(health.level === "เสี่ยงสูง"){
      rec.push({
        product:"ประกันสุขภาพ / ประกันโรคร้ายแรง",
        reason:"ลดความเสี่ยงค่าใช้จ่ายก้อนใหญ่จากการเจ็บป่วย"
      })
    }

    if(life.gap > 0){
      rec.push({
        product:"ประกันชีวิตแบบชั่วระยะเวลา",
        reason:"คุ้มครองครอบครัวในช่วงที่มีภาระสูง ด้วยเบี้ยต่ำ"
      })
    }

    if(wealth.score < 50){
      rec.push({
        product:"ประกันสะสมทรัพย์ / ประกันบำนาญ",
        reason:"ช่วยสร้างวินัยการออมระยะยาว"
      })
    }

    return rec
  }
}

/* =========================
   APP
========================= */
function App(){
  const [mode,setMode] = React.useState(null)
  const [step,setStep] = React.useState(0)
  const [result,setResult] = React.useState(null)

  const [data,setData] = React.useState({
    name:"",
    age:"",
    gender:"ชาย",
    status:"โสด",
    children:0,
    income:0,
    expenses:0,

    cash:0,
    invest:0,
    property:0,
    otherAsset:0,

    debtHome:0,
    debtCar:0,
    debtPersonal:0,

    insurances:[]
  })

  /* =========================
     QUESTIONS (LOCK)
  ========================= */
  const questions = [
    { label:"ชื่อ", key:"name", type:"text" },
    { label:"อายุ", key:"age", type:"number" },
    { label:"เพศ", key:"gender", type:"select", options:["ชาย","หญิง"] },
    { label:"สถานภาพ", key:"status", type:"select", options:["โสด","สมรส"] },
    { label:"จำนวนบุตร", key:"children", type:"number" },
    { label:"รายได้ต่อเดือน (บาท)", key:"income", type:"number" },
    { label:"ค่าใช้จ่ายต่อเดือน (บาท)", key:"expenses", type:"number" }
  ]

  if(mode==="DETAILED"){
    questions.push(
      { label:"เงินสด / เงินฝาก", key:"cash", type:"number" },
      { label:"การลงทุน (หุ้น / กองทุน)", key:"invest", type:"number" },
      { label:"อสังหาริมทรัพย์", key:"property", type:"number" },
      { label:"ทรัพย์สินอื่น ๆ", key:"otherAsset", type:"number" },
      { label:"หนี้บ้าน", key:"debtHome", type:"number" },
      { label:"หนี้รถ", key:"debtCar", type:"number" },
      { label:"หนี้ส่วนบุคคล / บัตรเครดิต", key:"debtPersonal", type:"number" }
    )
  }else if(mode==="QUICK"){
    questions.push(
      { label:"มูลค่าทรัพย์สินทั้งหมดโดยประมาณ (บาท)", key:"quickAsset", type:"number" },
      { label:"ภาระหนี้ทั้งหมดโดยประมาณ (บาท)", key:"quickDebt", type:"number" }
    )
  }

  /* =========================
     SUBMIT
  ========================= */
  const submit = ()=>{
    if(mode==="QUICK"){
      setData(d=>({
        ...d,
        cash:d.quickAsset*0.3,
        invest:d.quickAsset*0.7,
        debtHome:d.quickDebt
      }))
    }

    const health = RuleEngine.calculateHealthRisk(data)
    const wealth = RuleEngine.calculateWealthRisk(data)
    const life = RuleEngine.calculateLifeRisk(data)
    const rec = RuleEngine.recommend(health,wealth,life)

    setResult({health,wealth,life,rec})
  }

  /* =========================
     UI
  ========================= */
  if(!mode){
    return (
      <div className="min-h-screen flex flex-col justify-center items-center p-8 bg-white">
        <h1 className="text-3xl font-black mb-6 text-blue-900">AI Financial & Insurance Advisor</h1>
        <button className="w-full max-w-sm py-4 bg-blue-900 text-white rounded-xl font-black mb-4"
          onClick={()=>setMode("QUICK")}>
          Quick Mode
        </button>
        <button className="w-full max-w-sm py-4 bg-orange-500 text-white rounded-xl font-black"
          onClick={()=>setMode("DETAILED")}>
          Detailed Mode
        </button>
      </div>
    )
  }

  if(result){
    return (
      <div className="p-6 space-y-4">
        <h2 className="text-2xl font-black">ผลการวิเคราะห์</h2>

        <div className="bg-white p-4 rounded-xl">
          <b>เจ็บ (Health)</b> : {result.health.score} คะแนน ({result.health.level})
        </div>

        <div className="bg-white p-4 rounded-xl">
          <b>จน (Wealth)</b> : {result.wealth.score} คะแนน ({result.wealth.level})
        </div>

        <div className="bg-white p-4 rounded-xl">
          <b>ตาย (Life)</b> : {result.life.score} คะแนน ({result.life.level})<br/>
          Protection Gap: {formatNumber(result.life.gap)} บาท
        </div>

        <div className="bg-white p-4 rounded-xl">
          <b>คำแนะนำ</b>
          {result.rec.map((r,i)=>(
            <div key={i} className="mt-2">
              • {r.product}<br/>
              <span className="text-gray-500 text-sm">{r.reason}</span>
            </div>
          ))}
        </div>
      </div>
    )
  }

  const q = questions[step]

  return (
    <div className="min-h-screen flex flex-col justify-center p-6">
      <div className="bg-white p-6 rounded-xl space-y-4">
        <div className="font-black">{q.label}</div>

        {q.type==="select" ? (
          <select className="w-full p-3 border rounded"
            value={data[q.key]}
            onChange={e=>setData({...data,[q.key]:e.target.value})}>
            {q.options.map(o=><option key={o}>{o}</option>)}
          </select>
        ) : (
          <input
            className="w-full p-3 border rounded"
            value={data[q.key]}
            onChange={e=>setData({...data,[q.key]:parseNumber(e.target.value)})}
          />
        )}

        <div className="flex justify-between">
          {step>0 && <button onClick={()=>setStep(step-1)}>ย้อนกลับ</button>}
          {step<questions.length-1
            ? <button onClick={()=>setStep(step+1)}>ถัดไป</button>
            : <button onClick={submit} className="font-black text-blue-900">วิเคราะห์</button>}
        </div>
      </div>
    </div>
  )
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>)

</script>
</body>
</html>
